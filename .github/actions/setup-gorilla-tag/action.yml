name: 'Setup Gorilla Tag'
description: 'Places Gorilla Tag / BepInEx assemblies in the /Libs folder'
runs:
  using: 'composite'
  steps:
    - name: Download GT Assemblies
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p Libs
        gh release download --repo sirkingbinx/gtci --pattern "Stripped.zip" --output Stripped.zip
        unzip -o Stripped.zip -d Libs
    - name: Download latest BepInEx release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        mkdir -p _bepinex_dl
        cd _bepinex_dl

        echo "Downloading asset matching '${{ inputs.asset-pattern }}' from ${{ inputs.repo }}..."
        gh release download --repo "BepInEx/BepInEx" \
          --pattern "BepInEx_win_x64_*.zip" \
          --output BepInEx.zip

        echo "Extracting archive..."
        unzip -q -o BepInEx.zip -d extracted

    - name: Copy BepInEx/core into Libs
      shell: bash
      run: |
        set -euo pipefail

        SRC="_bepinex_dl/extracted/BepInEx/core"

        if [ ! -d "$SRC" ]; then
          echo "::error::Could not find BepInEx/core in the extracted archive. Contents were:"
          find _bepinex_dl/extracted -maxdepth 3
          exit 1
        fi

        cp -r "$SRC"/. "Libs/"

        echo "Copied BepInEx/core contents into Libs"

    - name: Clean up temp BepInEx files
      shell: bash
      run: rm -rf _bepinex_dl
        
