name: Generate Stripped DLLs
on:
  workflow_dispatch:
  schedule:
    - cron: 0 * * * *

jobs:
  generate:
    runs-on: windows-latest
    outputs:
      upload-files: ${{ steps.compare.outputs.different }}
    steps:
    # Compile
    - uses: actions/checkout@v7
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      env:
        ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    - name: Install dependencies
      run: msbuild -t:restore
    - name: Build project
      run: msbuild BeatStripper.sln /t:Build /p:Configuration=Release

    # Download game
    - name: Setup SteamCMD
      uses: CyberAndrii/setup-steamcmd@v1.1.1
    - name: Download Gorilla Tag
      run: steamcmd +@sSteamCmdForcePlatformType windows +login ${{secrets.STEAM_USERNAME}} ${{secrets.STEAM_PASSWORD}} +force_install_dir $pwd/gorillatag +app_update 1533390 +quit

    # Run stripper on game
    - name: Generate Stripped DLLs
      run: .\BeatStripper\bin\Release\GorillaTagStripper.exe .\gorillatag\

    # Compare new libs to old libs
    - name: Download Previous Libs
      id: download-previous
      continue-on-error: true
      uses: robinraju/release-downloader@v1.2
      with:
        repository: ${{ github.repository }}
        latest: true
        fileName: "Stripped.zip"
    - name: Unzip Previous Libs
      if: steps.download-previous.outcome == 'success'
      run: Expand-Archive -Path Stripped.zip -DestinationPath prev
    - name: Compare Files
      id: compare
      shell: bash
      run: |
        if [ ! -d prev ]; then
          echo "No previous release found — treating as different."
          echo "different=true" >> "$GITHUB_OUTPUT"
        elif diff -rq stripped prev > /dev/null; then
          echo "different=false" >> "$GITHUB_OUTPUT"
        else
          echo "different=true" >> "$GITHUB_OUTPUT"
        fi
    # Upload DLLs if different
    - name: Upload Stripped DLLs
      if: ${{ steps.compare.outputs.different == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: Stripped-${{ github.sha }}
        path: ./stripped

  upload:
    runs-on: ubuntu-latest
    needs: generate
    steps:
    # Download stripped libs from previous job
    - uses: actions/checkout@v7
    - name: Download Libs
      if: ${{ needs.generate.outputs.upload-files == 'true'}}
      uses: actions/download-artifact@v8
      with:
        name: Stripped-${{ github.sha }}
        path: ./stripped
    - name: Zip Files
      if: ${{ needs.generate.outputs.upload-files == 'true'}}
      shell: pwsh
      run: Compress-Archive -Path .\stripped\*.dll -DestinationPath .\compressed.zip
 
    # Bump semver
    - name: Get Latest Tag
      id: vars
      run: |
        # Fetch all tags explicitly
        git fetch --tags
        
        # Get the latest tag name reachable from history
        LATEST_TAG=$(git describe --tags --abbrev=0)
        
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
    - name: Bump semver
      if: ${{ needs.generate.outputs.upload-files == 'true'}}
      id: bump-semver
      uses: actions-ecosystem/action-bump-semver@v1
      with:
        current_version: ${{ steps.vars.outputs.latest_tag }}
        level: minor
    # Made release
    - name: Create Release
      if: ${{ needs.generate.outputs.upload-files == 'true'}}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.bump-semver.outputs.new_version }}
        release_name: ${{ steps.bump-semver.outputs.new_version }}
        files: Stripped.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
